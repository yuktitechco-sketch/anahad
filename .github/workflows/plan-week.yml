name: 1. Plan next week (for approval)

on:
  schedule:
    - cron: "30 3 * * 5"   # every Friday 09:00 India time
  workflow_dispatch:
    inputs:
      start:
        description: "First day, as YYYY-MM-DD (leave empty for next Monday)"
        required: false
      days:
        description: "How many days to prepare"
        default: "7"
      launch:
        description: "Picture posts on the first day (1 = normal, 10 = launch day)"
        default: "1"
      first:
        description: "Verse ID for the very first post (optional, for example V039)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          npm ci --silent
      - name: Note the verses in weeks still waiting for approval
        run: |
          mkdir -p "$RUNNER_TEMP/pending"
          git fetch -q origin '+refs/heads/week-*:refs/remotes/origin/week-*' || true
          for b in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/week-*'); do
            s="${b#origin/week-}"
            git show "$b:data/used/$s.json" > "$RUNNER_TEMP/pending/$s.json" 2>/dev/null || rm -f "$RUNNER_TEMP/pending/$s.json"
          done
      - name: Prepare posts and reels
        id: plan
        env:
          START: ${{ inputs.start }}
          DAYS: ${{ inputs.days || '7' }}
          LAUNCH: ${{ inputs.launch || '1' }}
          FIRST: ${{ inputs.first }}
          PR_BODY_FILE: ${{ runner.temp }}/pr_body.md
          PENDING_STATE_DIR: ${{ runner.temp }}/pending
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          ARGS=(--days "$DAYS" --launch "$LAUNCH")
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          if [ -n "$FIRST" ]; then ARGS+=(--first "$FIRST"); fi
          python3 scripts/plan_week.py "${ARGS[@]}"
      - name: Open the approval request
        if: steps.plan.outputs.start != ''
        env:
          GH_TOKEN: ${{ github.token }}
          START_DAY: ${{ steps.plan.outputs.start }}
          END_DAY: ${{ steps.plan.outputs.end }}
        run: |
          if git ls-remote --exit-code --heads origin "week-$START_DAY" > /dev/null; then
            echo "The week of $START_DAY is already waiting for approval; nothing to do."
            exit 0
          fi
          git config user.name "anahad-bot"
          git config user.email "anahad-bot@users.noreply.github.com"
          git checkout -b "week-$START_DAY"
          git add queue reviews data/used
          git commit -q -m "Posts for $START_DAY to $END_DAY"
          git push -q origin "week-$START_DAY"
          gh pr create --base main --head "week-$START_DAY" \
            --title "Approve posts for $START_DAY to $END_DAY" \
            --body-file "$RUNNER_TEMP/pr_body.md"
