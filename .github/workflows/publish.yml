name: 4. Automatic publishing (not in use)

on:
  # No timer: posts are published by hand from the posting page. To go back to automatic publishing,
  # add a schedule here and set publish_mode to "auto" in config.json.
  workflow_dispatch:
    inputs:
      kind:
        description: "What to publish"
        type: choice
        options: [post, reel, check, audio]
        default: check
      date:
        description: "Date, as YYYY-MM-DD (leave empty for today)"
        required: false

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          KIND: ${{ inputs.kind }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            python3 scripts/publish.py "$KIND" --date "$DATE"
          else
            python3 scripts/publish.py "$KIND"
          fi
      - name: Record what was published
        run: |
          git config user.name "anahad-bot"
          git config user.email "anahad-bot@users.noreply.github.com"
          git add queue
          if ! git diff --cached --quiet; then
            git commit -q -m "Published"
            git pull -q --rebase origin main
            git push -q origin main
          fi
